services:
  - type: web
    name: professional-amateur
    runtime: node
    plan: starter
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/index.js"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
